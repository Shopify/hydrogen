# Labels a pull request with `shopify.dev preview` when it changes the
# generated docs payload.
#

name: Shopify Dev preview label

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/hydrogen/docs/generated/generated_docs_data_v2.json'
      - 'packages/hydrogen/package.json'
      - 'packages/hydrogen/docs/screenshots/**'
      - 'packages/hydrogen-react/docs/generated/generated_docs_data_v2.json'
      - 'packages/hydrogen-react/package.json'
      - 'packages/hydrogen-react/docs/screenshots/**'

concurrency:
  group: shopify-dev-preview-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  label:
    name: Add the shopify.dev preview label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'Shopify'
    steps:
      - name: Add the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The label is sticky, so adding it again on a later push is a no-op
          # and the scan keeps the preview up to date on its own.
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label 'shopify.dev preview'
